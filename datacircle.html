<script type="text/markdown" data-help-name="datacircle">
A LinkedIn profile by its URL, through Up2Data or HarvestAPI, or your Datacircle balance.

You send the provider's own request to api.datacircle.dev, with your Datacircle key. That's the only change.

### Inputs

: payload (string) : the LinkedIn profile URL, when the node's URL is empty.
: url (string) : the LinkedIn profile URL, before `msg.payload`.
: provider (string) : `up2data` or `harvestapi`, instead of the node's Provider.
: operation (string) : `profile` or `balance`, instead of the node's Operation.

### Outputs

: payload (object) : the provider's own JSON plus `datacircle_meta`: `provider`, `cost_usd` (what this call cost) and `balance_usd` (what is left). For Balance, `balance_usd` and the credits it holds.
: statusCode (number) : the HTTP status.

### Details

Each request goes to the provider and gets the profile as it is today.

A status other than 2xx is an error: a Catch node gets the message, with `msg.statusCode` and `msg.payload`.

- `402`: a call your balance can't cover answers 402. Add funds, from $5, on your dashboard.
- `429`: Up2Data takes $1 a day per account (421 profiles), with a shared daily limit for all customers, then answers 429 until 00:00 UTC; HarvestAPI has no daily limit.
- `422`: Up2Data can't reach that profile (private or deleted). Not charged.

### References

- [LinkedIn profile API](https://docs.datacircle.dev/linkedin-profile)
- [Pricing](https://docs.datacircle.dev/pricing)
</script>
